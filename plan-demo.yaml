services:
  - type: web
    name: grow3554-plan-demo
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: 'true'
    startCommand: python -m http.server $PORT --bind 0.0.0.0
    envVars:
      - key: API_SECRET
        sync: false
      - key: PLAIN
        value: x
  - type: web
    name: grow3554-plan-demo-two
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: 'true'
    startCommand: python -m http.server $PORT --bind 0.0.0.0
    envVars:
      - key: WORKER_TOKEN
        sync: false
